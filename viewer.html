<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUPER STRIKER '26 — character viewer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧍</text></svg>" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1d23;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      #viewer-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #viewer-label {
        position: absolute;
        left: 16px;
        bottom: 14px;
        display: none;
        color: #e8ecf4;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="viewer-canvas"></canvas>
    <div id="viewer-label"></div>
    <script type="module" src="/src/tools/viewer.ts"></script>
  </body>
</html>
